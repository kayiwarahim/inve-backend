name: Laravel API CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    laravel-tests:
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: laravel
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=3

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  extensions: mbstring, pdo, pdo_mysql, bcmath
                  coverage: none

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: vendor
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-composer-

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Copy .env
              run: |
                  if [ ! -f .env ]; then
                    cp .env.example .env
                  fi

            - name: Generate application key
              run: php artisan key:generate

            - name: Set directory permissions
              run: chmod -R 777 storage bootstrap/cache

            - name: Run migrations
              env:
                  DB_CONNECTION: mysql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 3306
                  DB_DATABASE: laravel
                  DB_USERNAME: root
                  DB_PASSWORD: root
              run: php artisan migrate --force

            - name: Run tests
              env:
                  DB_CONNECTION: mysql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 3306
                  DB_DATABASE: laravel
                  DB_USERNAME: root
                  DB_PASSWORD: root
              run: php artisan test
